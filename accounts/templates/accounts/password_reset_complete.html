{% extends 'products/index.html' %}
{% block title %}Password Reset Complete - Almeer Dairy{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 text-center">
            <div class="card shadow border-0 rounded-3 p-4">
                <i class="fa-solid fa-circle-check text-success display-3 mb-3"></i>
                <h3 class="fw-bold text-dark">Password Changed!</h3>
                <p class="text-muted">Your password has been set successfully. You can now log in with your new credentials.</p>
                <a href="{% url 'login' %}" class="btn btn-success btn-lg fw-bold mt-2">Log In Now</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
