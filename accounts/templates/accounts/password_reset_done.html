{% extends 'products/index.html' %}
{% block title %}Email Sent - Almerr Dairy Dairy{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 text-center">
            <div class="card shadow border-0 rounded-3 p-4">
                <i class="fa-solid fa-paper-plane text-success display-3 mb-3"></i>
                <h3 class="fw-bold text-dark">Email Sent!</h3>
                <p class="text-muted">If an account exists with the email you entered, a verification code has been sent. Enter it to continue.</p>
                <a href="{% url 'password_reset_verify' %}" class="btn btn-success fw-bold mt-2">Enter Verification Code</a>
                <a href="{% url 'login' %}" class="btn btn-outline-success fw-bold mt-2">Return to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
